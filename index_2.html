<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NewsFlow AI — Information, Synthesized</title>
<meta name="description" content="NewsFlow AI — a premium news reader with AI-generated briefings and synthesis." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    --surface:#f9f9f9;
    --surface-dim:#dadada;
    --surface-bright:#f9f9f9;
    --surface-container-lowest:#ffffff;
    --surface-container-low:#f3f3f3;
    --surface-container:#eeeeee;
    --surface-container-high:#e8e8e8;
    --surface-container-highest:#e2e2e2;
    --on-surface:#1a1c1c;
    --on-surface-variant:#5b403d;
    --inverse-surface:#2f3131;
    --inverse-on-surface:#f1f1f1;
    --outline:#906f6c;
    --outline-variant:#e4beb9;
    --surface-tint:#bb171c;
    --primary:#b7131a;
    --on-primary:#ffffff;
    --primary-container:#db322f;
    --on-primary-container:#fffbff;
    --inverse-primary:#ffb4ac;
    --secondary:#5d5f5f;
    --on-secondary:#ffffff;
    --secondary-container:#dfe0e0;
    --on-secondary-container:#616363;
    --tertiary:#5d5c5b;
    --on-tertiary:#ffffff;
    --tertiary-container:#767474;
    --on-tertiary-container:#f7feff;
    --error:#ba1a1a;
    --on-error:#ffffff;
    --error-container:#ffdad6;
    --on-error-container:#93000a;
    --primary-fixed:#ffdad6;
    --primary-fixed-dim:#ffb4ac;
    --on-primary-fixed:#410002;
    --on-primary-fixed-variant:#93000d;
    --secondary-fixed:#e2e2e2;
    --secondary-fixed-dim:#c6c6c7;
    --on-secondary-fixed:#1a1c1c;
    --on-secondary-fixed-variant:#454747;
    --background:#f9f9f9;
    --on-background:#1a1c1c;
    --surface-variant:#e2e2e2;

    --radius-sm:.25rem;
    --radius:.5rem;
    --radius-md:.75rem;
    --radius-lg:1rem;
    --radius-xl:1.5rem;
    --radius-full:9999px;

    --space-base:8px;
    --space-xs:4px;
    --space-sm:12px;
    --space-md:24px;
    --space-lg:40px;
    --space-xl:64px;
    --space-gutter:16px;
    --margin-mobile:20px;
    --margin-desktop:120px;

    --shadow-1:0px 4px 20px rgba(0,0,0,0.05);
    --shadow-2:0px 12px 40px rgba(0,0,0,0.1);
    --shadow-ai:0px 4px 24px rgba(183,19,26,0.08);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--background);
    color:var(--on-background);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;}
  a{color:inherit;}

  ::selection{background:var(--primary-fixed);color:var(--on-primary-fixed);}

  :focus-visible{
    outline:2px solid var(--primary);
    outline-offset:2px;
    border-radius:var(--radius-sm);
  }

  /* ============ TYPE SCALE ============ */
  .t-display-lg{font-family:'Inter';font-size:48px;font-weight:800;line-height:56px;letter-spacing:-0.02em;}
  .t-headline-lg{font-family:'Inter';font-size:32px;font-weight:700;line-height:40px;letter-spacing:-0.01em;}
  .t-headline-md{font-family:'Inter';font-size:24px;font-weight:600;line-height:32px;}
  .t-body-lg{font-family:'Inter';font-size:18px;font-weight:400;line-height:28px;}
  .t-body-md{font-family:'Inter';font-size:16px;font-weight:400;line-height:24px;}
  .t-label-md{font-family:'Inter';font-size:14px;font-weight:600;line-height:20px;letter-spacing:0.02em;}
  .t-caption{font-family:'Inter';font-size:12px;font-weight:500;line-height:16px;}

  @media (max-width:719px){
    .t-headline-lg{font-size:28px;font-weight:700;line-height:34px;letter-spacing:-0.01em;}
  }

  /* ============ LAYOUT SHELL ============ */
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .ticker{
    background:var(--inverse-surface);
    color:var(--inverse-on-surface);
    display:flex;
    align-items:center;
    gap:var(--space-sm);
    padding:8px var(--margin-mobile);
    overflow:hidden;
    white-space:nowrap;
  }
  .ticker .dot{
    width:8px;height:8px;border-radius:var(--radius-full);
    background:var(--inverse-primary);
    flex:none;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.45;transform:scale(.8);}
  }
  .ticker .label{
    font-weight:700;letter-spacing:.04em;font-size:12px;color:var(--inverse-primary);flex:none;
  }
  .ticker-track{
    flex:1;overflow:hidden;position:relative;height:20px;
  }
  .ticker-inner{
    display:flex;gap:56px;position:absolute;white-space:nowrap;
    animation:scroll-left 26s linear infinite;
    font-size:14px;
  }
  @keyframes scroll-left{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  @media (prefers-reduced-motion:reduce){
    .ticker-inner{animation:none;}
    .dot{animation:none;}
  }

  .topbar{
    position:sticky;top:0;z-index:30;
    background:var(--surface-container-lowest);
    border-bottom:1px solid var(--surface-container-highest);
    padding:14px var(--margin-mobile);
    display:flex;align-items:center;gap:var(--space-sm);
  }
  .brand{
    display:flex;align-items:center;gap:8px;
    font-weight:800;font-size:20px;letter-spacing:-0.01em;
    color:var(--on-surface);
    flex:none;
    background:none;border:none;cursor:pointer;padding:0;
  }
  .brand .mark{
    width:30px;height:30px;border-radius:var(--radius);
    background:var(--primary);
    display:flex;align-items:center;justify-content:center;
    color:var(--on-primary);flex:none;
  }
  .brand .mark svg{width:17px;height:17px;}
  .brand-accent{color:var(--primary);}

  .search-wrap{
    flex:1;position:relative;max-width:520px;margin:0 auto;
  }
  .search-wrap svg.icon-search{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--outline);pointer-events:none;
  }
  .search-input{
    width:100%;
    background:var(--surface-container-low);
    border:1px solid transparent;
    border-radius:var(--radius-full);
    padding:10px 16px 10px 42px;
    font-size:14px;font-family:inherit;color:var(--on-surface);
    transition:border-color .15s ease, background .15s ease;
  }
  .search-input::placeholder{color:var(--on-secondary-container);}
  .search-input:focus{
    outline:none;border-color:var(--primary);background:var(--surface-container-lowest);
  }

  .topbar-actions{display:flex;align-items:center;gap:8px;flex:none;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-full);
    border:1px solid var(--surface-container-highest);
    background:var(--surface-container-lowest);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--on-surface);position:relative;
    transition:background .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{background:var(--surface-container-low);}
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn .badge{
    position:absolute;top:-3px;right:-3px;
    background:var(--primary);color:var(--on-primary);
    font-size:10px;font-weight:700;line-height:1;
    min-width:16px;height:16px;border-radius:var(--radius-full);
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  /* ============ MAIN LAYOUT ============ */
  .layout{
    flex:1;
    display:flex;
    width:100%;
  }

  .sidebar{
    display:none;
    flex:none;
    width:84px;
    padding:var(--space-lg) 0;
    flex-direction:column;
    align-items:center;
    gap:var(--space-md);
    border-right:1px solid var(--surface-container-highest);
    position:sticky;
    top:53px;
    height:calc(100vh - 53px);
  }
  .side-btn{
    width:52px;height:52px;border-radius:var(--radius-lg);
    border:none;background:transparent;color:var(--secondary);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .side-btn svg{width:21px;height:21px;}
  .side-btn span{font-size:10px;font-weight:600;}
  .side-btn:hover{background:var(--surface-container-low);color:var(--on-surface);}
  .side-btn.active{background:var(--primary-fixed);color:var(--on-primary-fixed-variant);}
  .side-spacer{flex:1;}

  .content-wrap{
    flex:1;min-width:0;
    display:flex;
    justify-content:center;
    padding:var(--space-md) var(--margin-mobile) 100px;
  }
  .content-grid{
    width:100%;
    max-width:1280px;
    display:grid;
    grid-template-columns:1fr;
    gap:var(--space-md);
  }

  main.feed-col{min-width:0;}
  .view-header{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:var(--space-sm);
    gap:8px;flex-wrap:wrap;
  }
  .view-title{color:var(--on-surface);}
  .view-sub{color:var(--on-surface-variant);margin-top:2px;}
  .result-count{color:var(--secondary);}

  /* chips */
  .chips-row{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:var(--space-sm);
    margin-bottom:var(--space-sm);
    scrollbar-width:none;
  }
  .chips-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;
    padding:8px 16px;
    border-radius:var(--radius-sm);
    background:var(--surface-container);
    color:var(--on-secondary-container);
    border:1px solid transparent;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease,color .15s ease;
  }
  .chip:hover{background:var(--surface-container-high);}
  .chip.active{
    background:var(--primary);color:var(--on-primary);
  }

  /* ============ NEWS CARDS ============ */
  .feed{display:flex;flex-direction:column;gap:var(--space-md);}

  .hero-card{
    position:relative;border-radius:var(--radius-lg);overflow:hidden;
    background:var(--surface-container-lowest);
    box-shadow:var(--shadow-1);
    cursor:pointer;border:none;text-align:left;padding:0;display:block;width:100%;
  }
  .hero-card img{width:100%;height:340px;object-fit:cover;}
  .hero-card .hero-overlay{
    position:absolute;inset:0;
    background:linear-gradient(0deg, rgba(26,28,28,.86) 0%, rgba(26,28,28,.35) 55%, rgba(26,28,28,0) 100%);
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:var(--space-md);
  }
  .hero-card .hero-tags{display:flex;gap:8px;margin-bottom:10px;}
  .badge-breaking{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--primary);color:var(--on-primary);
    padding:5px 10px;border-radius:var(--radius-sm);
    font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  }
  .badge-breaking .dot-sm{width:6px;height:6px;background:#fff;border-radius:50%;animation:pulse 1.6s ease-in-out infinite;}
  .badge-cat{
    background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(2px);
    padding:5px 10px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;
    border:1px solid rgba(255,255,255,.25);
  }
  .hero-card h2{
    color:#fff;margin:0 0 8px;
    max-width:80%;
  }
  .hero-meta{color:rgba(255,255,255,.78);display:flex;gap:10px;align-items:center;font-size:13px;}
  .hero-meta .sep{opacity:.5;}

  .card-row{
    display:grid;grid-template-columns:1fr;gap:var(--space-md);
  }
  @media (min-width:560px){
    .card-row{grid-template-columns:1fr 1fr;}
  }

  .news-card{
    border-radius:var(--radius-lg);
    background:var(--surface-container-lowest);
    box-shadow:var(--shadow-1);
    overflow:hidden;
    cursor:pointer;border:none;text-align:left;padding:0;
    display:flex;flex-direction:column;
    transition:transform .18s ease, box-shadow .18s ease;
    position:relative;
    width:100%;
  }
  .news-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);}
  .news-card .thumb-wrap{position:relative;}
  .news-card img{width:100%;height:168px;object-fit:cover;}
  .card-cat{
    position:absolute;top:10px;left:10px;
    background:rgba(26,28,28,.62);color:#fff;
    padding:4px 9px;border-radius:var(--radius-sm);
    font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  }
  .bookmark-btn{
    position:absolute;top:8px;right:8px;
    width:32px;height:32px;border-radius:var(--radius-full);
    background:rgba(26,28,28,.5);border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s ease;
  }
  .bookmark-btn:hover{background:rgba(26,28,28,.75);}
  .bookmark-btn svg{width:16px;height:16px;}
  .bookmark-btn.saved{color:var(--inverse-primary);}
  .bookmark-btn.saved svg{fill:currentColor;}

  .card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-body h3{
    margin:0;color:var(--on-surface);font-size:17px;font-weight:700;line-height:23px;letter-spacing:-0.005em;
  }
  .card-ai-tag{
    display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
    background:rgba(183,19,26,0.06);
    border:1px solid var(--outline-variant);
    color:var(--primary);
    padding:4px 9px;border-radius:var(--radius-sm);
    font-size:11px;font-weight:600;
  }
  .card-ai-tag svg{width:11px;height:11px;}
  .card-foot{
    margin-top:auto;display:flex;align-items:center;justify-content:space-between;
    color:var(--on-secondary-container);font-size:12px;padding-top:6px;
  }
  .card-foot .source{font-weight:600;color:var(--secondary);}
  .card-foot .dot{margin:0 5px;opacity:.6;}

  .empty-state{
    text-align:center;padding:72px 20px;color:var(--on-surface-variant);
    background:var(--surface-container-lowest);border-radius:var(--radius-lg);border:1px dashed var(--outline-variant);
  }
  .empty-state svg{width:38px;height:38px;color:var(--outline);margin-bottom:10px;}
  .empty-state .es-title{color:var(--on-surface);margin-bottom:4px;}

  /* ============ AI PANEL ============ */
  .ai-panel{
    display:none;
    flex-direction:column;
    gap:var(--space-md);
  }
  .ai-card{
    background:var(--surface-container-lowest);
    border:1px solid var(--outline-variant);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-ai);
    padding:20px;
  }
  .ai-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .ai-card-head .h-left{display:flex;align-items:center;gap:8px;}
  .ai-glyph{
    width:30px;height:30px;border-radius:var(--radius);
    background:linear-gradient(135deg, var(--primary), var(--primary-container));
    display:flex;align-items:center;justify-content:center;color:#fff;flex:none;
  }
  .ai-glyph svg{width:16px;height:16px;}
  .refresh-btn{
    background:none;border:none;color:var(--secondary);cursor:pointer;
    width:30px;height:30px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .3s ease;
  }
  .refresh-btn:hover{background:var(--surface-container-low);}
  .refresh-btn.spin svg{animation:spin .5s ease;}
  @keyframes spin{to{transform:rotate(180deg);}}
  .refresh-btn svg{width:15px;height:15px;}

  .briefing-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .briefing-list li{
    display:flex;gap:10px;color:var(--on-surface);font-size:14px;line-height:21px;
  }
  .briefing-list .num{
    flex:none;width:20px;height:20px;border-radius:var(--radius-full);
    background:var(--primary-fixed);color:var(--on-primary-fixed-variant);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .briefing-foot{
    margin-top:14px;padding-top:12px;border-top:1px solid var(--surface-container-highest);
    color:var(--on-surface-variant);font-size:12px;
  }

  .trend-list{display:flex;flex-direction:column;gap:2px;}
  .trend-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 4px;border-bottom:1px solid var(--surface-container);
    cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;
  }
  .trend-item:last-child{border-bottom:none;}
  .trend-item:hover .trend-name{color:var(--primary);}
  .trend-name{color:var(--on-surface);font-size:13px;font-weight:600;transition:color .15s ease;}
  .trend-count{color:var(--secondary);font-size:12px;}

  /* chat */
  .chat-card{
    display:flex;flex-direction:column;
    flex:1;min-height:380px;
  }
  .chat-scroll{
    flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
    padding:2px 2px 10px;margin:4px -4px 10px;max-height:360px;
  }
  .bubble{
    max-width:88%;padding:10px 13px;border-radius:var(--radius-md);font-size:14px;line-height:20px;
  }
  .bubble.ai{
    align-self:flex-start;
    background:rgba(183,19,26,0.05);
    border:1px solid var(--outline-variant);
    color:var(--on-surface);
    border-top-left-radius:4px;
  }
  .bubble.user{
    align-self:flex-end;
    background:var(--secondary-container);
    color:var(--on-secondary-container);
    border-top-right-radius:4px;
  }
  .bubble ul{margin:6px 0 0;padding-left:18px;}
  .bubble a.chat-link{color:var(--primary);font-weight:600;cursor:pointer;text-decoration:underline;}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:12px 13px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--outline);animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  .prompt-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .prompt-chip{
    background:var(--surface-container-low);border:1px solid var(--surface-container-highest);
    color:var(--on-surface-variant);border-radius:var(--radius-full);
    padding:6px 12px;font-size:12px;cursor:pointer;transition:background .15s ease;
  }
  .prompt-chip:hover{background:var(--surface-container-high);}

  .chat-input-row{display:flex;gap:8px;align-items:center;}
  .chat-input{
    flex:1;border:1px solid var(--surface-container-highest);background:var(--surface-container-low);
    border-radius:var(--radius-full);padding:10px 16px;font-size:14px;font-family:inherit;color:var(--on-surface);
    transition:border-color .15s ease;
  }
  .chat-input:focus{outline:none;border-color:var(--primary);background:var(--surface-container-lowest);}
  .send-btn{
    flex:none;width:40px;height:40px;border-radius:var(--radius-full);border:none;
    background:var(--primary);color:var(--on-primary);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s ease,transform .1s ease;
  }
  .send-btn:hover{background:var(--primary-container);}
  .send-btn:active{transform:scale(.92);}
  .send-btn svg{width:16px;height:16px;}
  .send-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ============ BUTTONS (generic) ============ */
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;
    border-radius:var(--radius-full);padding:11px 22px;cursor:pointer;border:none;
    display:inline-flex;align-items:center;gap:6px;transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn-primary{background:var(--primary);color:var(--on-primary);}
  .btn-primary:hover{background:var(--primary-container);}
  .btn-ghost{background:transparent;color:var(--on-surface);border:1px solid var(--outline);}
  .btn-ghost:hover{background:var(--surface-container-low);}

  /* ============ BOTTOM NAV (mobile) ============ */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--surface-container-lowest);
    border-top:1px solid var(--surface-container-highest);
    display:flex;justify-content:space-around;align-items:center;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .bn-btn{
    background:none;border:none;color:var(--secondary);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:6px 2px;
    border-radius:var(--radius);position:relative;
  }
  .bn-btn svg{width:21px;height:21px;}
  .bn-btn span{font-size:10px;font-weight:600;}
  .bn-btn.active{color:var(--primary);}
  .bn-btn .badge{
    position:absolute;top:2px;right:22%;
    background:var(--primary);color:#fff;font-size:9px;font-weight:700;
    min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }

  /* ============ MODAL: ARTICLE ============ */

  function minsAgo(m){ return Date.now() - m*60000; }

  function timeAgo(ts){
    var diff = Math.max(1, Math.round((Date.now()-ts)/60000));
    if(diff < 60) return diff + "m ago";
    var h = Math.round(diff/60);
    if(h < 24) return h + "h ago";
    var d = Math.round(h/24);
    return d + "d ago";
  }

  function imgUrl(seed, w, h){
    return "https://picsum.photos/seed/"+encodeURIComponent(seed)+"/"+w+"/"+h;
  }

  /* ============================================================
     STATE
  ============================================================ */
  var state = {
    category: "All",
    query: "",
    view: "home", // home | discover | bookmarks
    bookmarks: loadBookmarks(),
    currentArticleId: null
  };

  function loadBookmarks(){
    try{
      var raw = localStorage.getItem("newsflow_bookmarks");
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveBookmarks(){
    try{ localStorage.setItem("newsflow_bookmarks", JSON.stringify(state.bookmarks)); }catch(e){}
  }
  function isBookmarked(id){ return state.bookmarks.indexOf(id) !== -1; }
  function toggleBookmark(id){
    var i = state.bookmarks.indexOf(id);
    if(i === -1) state.bookmarks.push(id); else state.bookmarks.splice(i,1);
    saveBookmarks();
    updateBookmarkBadges();
    renderFeed();
    if(state.currentArticleId === id) syncModalBookmarkBtn();
  }

  function updateBookmarkBadges(){
    var n = state.bookmarks.length;
    [ "bookmarkBadge","bookmarkBadgeMobile" ].forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      if(n > 0){ el.style.display = "flex"; el.textContent = n > 99 ? "99+" : String(n); }
      else { el.style.display = "none"; }
    });
  }

  /* ============================================================
     ICONS (small helper set reused in JS-built markup)
  ============================================================ */
  var ICON_BOOKMARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  var ICON_SPARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.7L18 9l-4.4 1.3L12 15l-1.6-4.7L6 9l4.4-1.3L12 3z"/><path d="M19 14l.8 2.3L22 17l-2.2.7L19 20l-.8-2.3L16 17l2.2-.7L19 14z"/></svg>';
  var ICON_INBOX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>';

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ============================================================
     TICKER
  ============================================================ */
  function renderTicker(){
    var items = ARTICLES.filter(function(a){ return a.breaking || a.trending; })
      .slice(0,6)
      .map(function(a){ return escapeHtml(a.title); });
    var html = items.map(function(t){ return '<span>'+t+'</span>'; }).join("");
    document.getElementById("tickerInner").innerHTML = html + html; // duplicate for seamless loop
  }

  /* ============================================================
     CHIPS
  ============================================================ */
  function renderChips(){
    var row = document.getElementById("chipsRow");
    var cats = ["All"].concat(CATEGORIES);
    row.innerHTML = cats.map(function(c){
      var active = c === state.category ? " active" : "";
      return '<button class="chip'+active+'" data-cat="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>';
    }).join("");
    Array.prototype.forEach.call(row.querySelectorAll(".chip"), function(btn){
      btn.addEventListener("click", function(){
        state.category = btn.getAttribute("data-cat");
        renderChips();
        renderFeed();
      });
    });
  }

  /* ============================================================
     FEED
  ============================================================ */
  function getFilteredArticles(){
    var list = ARTICLES.slice();

    if(state.view === "bookmarks"){
      list = list.filter(function(a){ return isBookmarked(a.id); });
    } else if(state.view === "discover"){
      list = list.filter(function(a){ return a.trending; });
    }

    if(state.category !== "All"){
      list = list.filter(function(a){ return a.category === state.category; });
    }

    var q = state.query.trim().toLowerCase();
    if(q){
      list = list.filter(function(a){
        return a.title.toLowerCase().indexOf(q) !== -1 ||
               a.category.toLowerCase().indexOf(q) !== -1 ||
               a.source.toLowerCase().indexOf(q) !== -1 ||
               a.tags.join(" ").toLowerCase().indexOf(q) !== -1 ||
               a.lede.toLowerCase().indexOf(q) !== -1;
      });
    }

    list.sort(function(x,y){ return y.time - x.time; });
    return list;
  }

  function updateViewHeader(){
    var titleEl = document.getElementById("viewTitle");
    var subEl = document.getElementById("viewSub");
    var chipsRow = document.getElementById("chipsRow");
    if(state.view === "bookmarks"){
      titleEl.textContent = "Saved Articles";
      subEl.textContent = state.bookmarks.length ? "Everything you've bookmarked, in one place" : "Nothing saved yet";
      chipsRow.style.display = "none";
    } else if(state.view === "discover"){
      titleEl.textContent = "Trending Now";
      subEl.textContent = "What's generating the most attention right now";
      chipsRow.style.display = "flex";
    } else {
      titleEl.textContent = "Today's Briefing";
      subEl.textContent = "Synthesized from 24 sources, updated moments ago";
      chipsRow.style.display = "flex";
    }
  }

  function renderFeed(){
    updateViewHeader();
    var list = getFilteredArticles();
    var feedEl = document.getElementById("feed");
    var countEl = document.getElementById("resultCount");
    countEl.textContent = list.length + (list.length === 1 ? " story" : " stories");

    if(list.length === 0){
      feedEl.innerHTML =
        '<div class="empty-state">'+
          ICON_INBOX +
          '<div class="t-headline-md es-title">'+(state.view === "bookmarks" ? "No saved articles" : "No stories match")+'</div>'+
          '<div class="t-body-md">'+(state.view === "bookmarks" ? "Tap the bookmark icon on any story to save it here." : "Try a different category or search term.")+'</div>'+
        '</div>';
      return;
    }

    var hero = null;
    var rest = list;
    if(state.view === "home" && state.category === "All" && !state.query.trim()){
      hero = list[0];
      rest = list.slice(1);
    }

    var html = "";
    if(hero){
      html += heroCardHtml(hero);
    }
    html += '<div class="card-row">' + rest.map(newsCardHtml).join("") + '</div>';
    feedEl.innerHTML = html;

    wireCardEvents(feedEl);
  }

  function heroCardHtml(a){
    return (
      '<button class="hero-card" data-open="'+a.id+'">'+
        '<img src="'+imgUrl(a.seed, 1000, 600)+'" alt="" loading="lazy" />'+
        '<div class="hero-overlay">'+
          '<div class="hero-tags">'+
            (a.breaking ? '<span class="badge-breaking"><span class="dot-sm"></span>Breaking</span>' : '') +
            '<span class="badge-cat">'+escapeHtml(a.category)+'</span>'+
          '</div>'+
          '<h2 class="t-headline-lg">'+escapeHtml(a.title)+'</h2>'+
          '<div class="hero-meta"><span>'+escapeHtml(a.source)+'</span><span class="sep">·</span><span>'+timeAgo(a.time)+'</span><span class="sep">·</span><span>'+a.readtime+'</span></div>'+
        '</div>'+
      '</button>'
    );
  }

  function newsCardHtml(a){
    var saved = isBookmarked(a.id);
    return (
      '<button class="news-card" data-open="'+a.id+'">'+
        '<div class="thumb-wrap">'+
          '<img src="'+imgUrl(a.seed, 500, 340)+'" alt="" loading="lazy" />'+
          '<span class="card-cat">'+escapeHtml(a.category)+'</span>'+
          '<span class="bookmark-btn'+(saved?' saved':'')+'" data-bookmark="'+a.id+'" role="button" tabindex="0" aria-label="'+(saved?'Remove bookmark':'Save article')+'">'+ICON_BOOKMARK+'</span>'+
        '</div>'+
        '<div class="card-body">'+
          '<h3>'+escapeHtml(a.title)+'</h3>'+
          '<span class="card-ai-tag">'+ICON_SPARK+' AI insight available</span>'+
          '<div class="card-foot">'+
            '<span class="source">'+escapeHtml(a.source)+'</span>'+
            '<span>'+timeAgo(a.time)+' <span class="dot">·</span> '+a.readtime+'</span>'+
          '</div>'+
        '</div>'+
      '</button>'
    );
  }

  function wireCardEvents(container){
    Array.prototype.forEach.call(container.querySelectorAll("[data-open]"), function(el){
      el.addEventListener("click", function(e){
        if(e.target.closest("[data-bookmark]")) return;
        openArticle(el.getAttribute("data-open"));
      });
    });
    Array.prototype.forEach.call(container.querySelectorAll("[data-bookmark]"), function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        toggleBookmark(el.getAttribute("data-bookmark"));
      });
      el.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault(); e.stopPropagation();
          toggleBookmark(el.getAttribute("data-bookmark"));
        }
      });
    });
  }

  /* ============================================================
     ARTICLE MODAL
  ============================================================ */
  function findArticle(id){
    for(var i=0;i<ARTICLES.length;i++){ if(ARTICLES[i].id === id) return ARTICLES[i]; }
    return null;
  }

  function openArticle(id){
    var a = findArticle(id);
    if(!a) return;
    state.currentArticleId = id;

    document.getElementById("modalImg").src = imgUrl(a.seed, 900, 500);
    document.getElementById("modalImg").alt = a.title;
    document.getElementById("modalCat").textContent = (a.breaking ? "Breaking · " : "") + a.category;
    document.getElementById("modalHeadline").textContent = a.title;
    document.getElementById("modalSource").textContent = a.source;
    document.getElementById("modalTime").textContent = timeAgo(a.time);
    document.getElementById("modalReadtime").textContent = a.readtime;
    document.getElementById("modalLede").textContent = a.lede;
    document.getElementById("modalText").innerHTML = a.body.map(function(p){ return "<p>"+escapeHtml(p)+"</p>"; }).join("");
    document.getElementById("modalInsight").textContent = a.insight;
    document.getElementById("modalTags").innerHTML = a.tags.map(function(t){ return '<span class="tag-pill">'+escapeHtml(t)+'</span>'; }).join("");

    syncModalBookmarkBtn();

    var overlay = document.getElementById("modalOverlay");
    overlay.classList.add("open");
    overlay.scrollTop = 0;
    document.body.style.overflow = "hidden";
  }

  function syncModalBookmarkBtn(){
    var btn = document.getElementById("modalBookmark");
    var saved = state.currentArticleId && isBookmarked(state.currentArticleId);
    btn.classList.toggle("saved", !!saved);
    btn.style.color = saved ? "var(--primary)" : "var(--secondary)";
  }

  function closeModal(){
    document.getElementById("modalOverlay").classList.remove("open");
    document.body.style.overflow = "";
  }

  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalCloseBtn2").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", function(e){
    if(e.target === this) closeModal();
  });
  document.getElementById("modalBookmark").addEventListener("click", function(){
    if(state.currentArticleId) toggleBookmark(state.currentArticleId);
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      closeModal();
      closeAiSheet();
    }
  });
  document.getElementById("askAiAboutBtn").addEventListener("click", function(){
    var a = findArticle(state.currentArticleId);
    if(!a) return;
    closeModal();
    var question = "Tell me more about \"" + a.title + "\"";
    if(window.innerWidth >= 1024){
      document.getElementById("chatInputDesktop").value = question;
      submitChat("desktop");
    } else {
      openAiSheet();
      document.getElementById("chatInputMobile").value = question;
      submitChat("mobile");
    }
  });

  /* ============================================================
     TRENDING PANEL
  ============================================================ */
  function renderTrending(){
    var trending = ARTICLES.filter(function(a){ return a.trending; }).slice(0,5);
    var el = document.getElementById("trendList");
    el.innerHTML = trending.map(function(a, i){
      return (
        '<button class="trend-item" data-open="'+a.id+'">'+
          '<span class="trend-name">'+escapeHtml(a.category)+' · '+escapeHtml(shorten(a.title, 46))+'</span>'+
          '<span class="trend-count">#'+(i+1)+'</span>'+
        '</button>'
      );
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll("[data-open]"), function(btn){
      btn.addEventListener("click", function(){ openArticle(btn.getAttribute("data-open")); });
    });
  }

  function shorten(s, n){
    return s.length > n ? s.slice(0,n-1).trim()+"…" : s;
  }

  /* ============================================================
     AI BRIEFING
  ============================================================ */
  var briefingTemplates = [
    function(a){ return "Markets and policy watchers are focused on " + a.title.toLowerCase() + "."; },
    function(a){ return "In " + a.category.toLowerCase() + ", " + a.source + " reports: " + a.title.toLowerCase() + "."; },
    function(a){ return a.title + " — " + a.insight.split(".")[0].replace(/^The AI (notes|flags|stresses|highlights|points out) that /i, "").replace(/^./, function(c){return c.toLowerCase();}) + "."; }
  ];

  function pickBriefingArticles(){
    var breaking = ARTICLES.filter(function(a){ return a.breaking; });
    var trending = ARTICLES.filter(function(a){ return a.trending && !a.breaking; });
    var picks = breaking.concat(trending).slice(0,3);
    if(picks.length < 3){
      ARTICLES.forEach(function(a){ if(picks.length<3 && picks.indexOf(a)===-1) picks.push(a); });
    }
    return picks;
  }

  function generateBriefing(){
    var picks = pickBriefingArticles();
    var lines = picks.map(function(a, i){
      var tpl = briefingTemplates[i % briefingTemplates.length];
      return tpl(a);
    });
    var html = lines.map(function(text, i){
      return '<li><span class="num">'+(i+1)+'</span><span>'+escapeHtml(text)+'</span></li>';
    }).join("");
    document.getElementById("briefingList").innerHTML = html;
    document.getElementById("briefingListMobile").innerHTML = html.replace(/<li>/g, '<li style="font-size:13px;">');
    document.getElementById("briefingFoot").textContent = "Generated by NewsFlow AI · " + timeAgo(Date.now() - 60000);
  }

  document.getElementById("refreshBriefing").addEventListener("click", function(){
    var btn = this;
    btn.classList.add("spin");
    setTimeout(function(){ btn.classList.remove("spin"); }, 500);
    setTimeout(generateBriefing, 220);
  });

  /* ============================================================
     AI CHAT (rule-based synthesis over the local corpus)
  ============================================================ */
  var STOPWORDS = ["the","a","an","of","in","on","for","to","and","is","are","what","whats","about","tell","me","any","news","today","story","stories","article"];

  function scoreArticle(article, queryWords){
    var text = (article.title + " " + article.category + " " + article.tags.join(" ") + " " + article.lede).toLowerCase();
    var score = 0;
    queryWords.forEach(function(w){
      if(w.length < 3) return;
      if(text.indexOf(w) !== -1) score += (article.title.toLowerCase().indexOf(w) !== -1 ? 3 : 1);
    });
    return score;
  }

  function findCategoryMention(q){
    for(var i=0;i<CATEGORIES.length;i++){
      if(q.indexOf(CATEGORIES[i].toLowerCase()) !== -1) return CATEGORIES[i];
    }
    if(q.indexOf("tech") !== -1) return "Technology";
    if(q.indexOf("environment") !== -1 || q.indexOf("weather") !== -1) return "Climate";
    return null;
  }

  function aiRespond(rawText){
    var q = rawText.trim().toLowerCase();
    if(!q) return { html: "Ask me about a topic, a category, or say <em>“summarize today”</em> for a quick briefing." };

    if(/^(hi|hey|hello|yo|sup)\b/.test(q)){
      return { html: "Hi — I can summarize today's coverage, dig into a specific story, or point you to what's trending. What are you curious about?" };
    }

    if(q.indexOf("bookmark") !== -1 || q.indexOf("saved") !== -1){
      var n = state.bookmarks.length;
      if(n === 0) return { html: "You haven't saved anything yet — tap the bookmark icon on any story to keep it here." };
      var saved = ARTICLES.filter(function(a){ return isBookmarked(a.id); }).slice(0,5);
      return { html: "You've saved "+n+" "+(n===1?"story":"stories")+":<ul>" + saved.map(function(a){ return '<li><a class="chat-link" data-open="'+a.id+'">'+escapeHtml(a.title)+'</a></li>'; }).join("") + "</ul>" };
    }

    if(q.indexOf("breaking") !== -1){
      var breaking = ARTICLES.filter(function(a){ return a.breaking; });
      if(breaking.length === 0) return { html: "Nothing marked breaking right now — the top trending story is <a class=\"chat-link\" data-open=\""+ARTICLES[0].id+"\">"+escapeHtml(ARTICLES[0].title)+"</a>." };
      return { html: "Breaking right now:<ul>" + breaking.map(function(a){ return '<li><a class="chat-link" data-open="'+a.id+'">'+escapeHtml(a.title)+'</a> — '+escapeHtml(a.source)+'</li>'; }).join("") + "</ul>" };
    }

    if(q.indexOf("trend") !== -1){
      var trending = ARTICLES.filter(function(a){ return a.trending; }).slice(0,5);
      return { html: "Trending now:<ul>" + trending.map(function(a){ return '<li><a class="chat-link" data-open="'+a.id+'">'+escapeHtml(a.title)+'</a></li>'; }).join("") + "</ul>" };
    }

    if(q.indexOf("summar") !== -1 || q.indexOf("briefing") !== -1 || (q.indexOf("today") !== -1 && q.indexOf("what") !== -1)){
      var picks = pickBriefingArticles();
      return { html: "Here's the gist of today's top coverage:<ul>" + picks.map(function(a){ return '<li><a class="chat-link" data-open="'+a.id+'">'+escapeHtml(a.title)+'</a></li>'; }).join("") + "</ul>Want me to go deeper on any of these?" };
    }

    var cat = findCategoryMention(q);
    if(cat){
      var inCat = ARTICLES.filter(function(a){ return a.category === cat; }).slice(0,4);
      return { html: "In "+cat+", the stories getting the most attention:<ul>" + inCat.map(function(a){ return '<li><a class="chat-link" data-open="'+a.id+'">'+escapeHtml(a.title)+'</a></li>'; }).join("") + "</ul>" };
    }

    var words = q.split(/[^a-z0-9]+/).filter(function(w){ return w && STOPWORDS.indexOf(w) === -1; });
    if(words.length){
      var best = null, bestScore = 0;
      ARTICLES.forEach(function(a){
        var s = scoreArticle(a, words);
        if(s > bestScore){ bestScore = s; best = a; }
      });
      if(best && bestScore > 0){
        return { html: '<strong>'+escapeHtml(best.title)+'</strong><br/>' + escapeHtml(best.lede) + '<br/><br/><em>Key takeaway:</em> ' + escapeHtml(best.insight) + '<br/><a class="chat-link" data-open="'+best.id+'">Read the full story →</a>' };
      }
    }

    return { html: "I couldn't find a strong match for that in today's coverage. Try a topic like “tech,” “climate,” or “what's trending,” or tap “summarize today.”" };
  }

  function appendBubble(scrollEl, role, html){
    var b = document.createElement("div");
    b.className = "bubble " + role;
    b.innerHTML = html;
    scrollEl.appendChild(b);
    scrollEl.scrollTop = scrollEl.scrollHeight;
    Array.prototype.forEach.call(b.querySelectorAll("[data-open]"), function(link){
      link.addEventListener("click", function(){ openArticle(link.getAttribute("data-open")); });
    });
    return b;
  }

  function showTyping(scrollEl){
    var t = document.createElement("div");
    t.className = "bubble ai typing";
    t.innerHTML = "<span></span><span></span><span></span>";
    scrollEl.appendChild(t);
    scrollEl.scrollTop = scrollEl.scrollHeight;
    return t;
  }

  var GREETED = { desktop:false, mobile:false };
  function ensureGreeting(which){
    if(GREETED[which]) return;
    GREETED[which] = true;
    var scrollEl = document.getElementById(which === "desktop" ? "chatScrollDesktop" : "chatScrollMobile");
    appendBubble(scrollEl, "ai", "Hi, I'm your NewsFlow AI assistant. I can summarize today's coverage, explain a story's significance, or surface what's trending. Try one of the prompts below, or ask your own question.");
  }

  var PROMPTS = [
    "Summarize today's news",
    "What's trending?",
    "Any breaking news?",
    "What's happening in Technology?"
  ];

  function renderPromptChips(){
    [["promptChipsDesktop","desktop"], ["promptChipsMobile","mobile"]].forEach(function(pair){
      var el = document.getElementById(pair[0]);
      el.innerHTML = PROMPTS.map(function(p){ return '<button class="prompt-chip" data-prompt="'+escapeHtml(p)+'">'+escapeHtml(p)+'</button>'; }).join("");
      Array.prototype.forEach.call(el.querySelectorAll("[data-prompt]"), function(btn){
        btn.addEventListener("click", function(){
          var which = pair[1];
          var input = document.getElementById(which === "desktop" ? "chatInputDesktop" : "chatInputMobile");
          input.value = btn.getAttribute("data-prompt");
          submitChat(which);
        });
      });
    });
  }

  function submitChat(which){
    var inputEl = document.getElementById(which === "desktop" ? "chatInputDesktop" : "chatInputMobile");
    var scrollEl = document.getElementById(which === "desktop" ? "chatScrollDesktop" : "chatScrollMobile");
    var text = inputEl.value.trim();
    if(!text) return;
    ensureGreeting(which);
    appendBubble(scrollEl, "user", escapeHtml(text));
    inputEl.value = "";
    var typing = showTyping(scrollEl);
    var delay = 420 + Math.random()*420;
    setTimeout(function(){
      typing.remove();
      var resp = aiRespond(text);
      appendBubble(scrollEl, "ai", resp.html);
    }, delay);
  }

  document.getElementById("chatSendDesktop").addEventListener("click", function(){ submitChat("desktop"); });
  document.getElementById("chatSendMobile").addEventListener("click", function(){ submitChat("mobile"); });
  document.getElementById("chatInputDesktop").addEventListener("keydown", function(e){ if(e.key === "Enter") submitChat("desktop"); });
  document.getElementById("chatInputMobile").addEventListener("keydown", function(e){ if(e.key === "Enter") submitChat("mobile"); });

  /* ============================================================
     NAV / VIEW SWITCHING
  ============================================================ */
  function setActiveNav(navName){
    Array.prototype.forEach.call(document.querySelectorAll(".side-btn[data-nav]"), function(b){
      b.classList.toggle("active", b.getAttribute("data-nav") === navName);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".bn-btn[data-nav]"), function(b){
      b.classList.toggle("active", b.getAttribute("data-nav") === navName);
    });
  }

  function goToView(view){
    if(view === "ai"){
      openAiSheet();
      return;
    }
    if(view === "settings"){
      // No settings surface in this build — gently no-op back to home.
      view = "home";
    }
    state.view = view;
    state.category = "All";
    renderChips();
    renderFeed();
    setActiveNav(view);
    window.scrollTo({top:0, behavior:"smooth"});
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(btn){
    btn.addEventListener("click", function(){ goToView(btn.getAttribute("data-nav")); });
  });

  document.getElementById("logoBtn").addEventListener("click", function(){ goToView("home"); });
  document.getElementById("bookmarkTopBtn").addEventListener("click", function(){ goToView("bookmarks"); });
  document.getElementById("aiTopBtn").addEventListener("click", function(){ openAiSheet(); document.getElementById("chatInputDesktop").focus(); if(window.innerWidth>=1024){ closeAiSheet(); document.getElementById("chatInputDesktop").scrollIntoView({behavior:"smooth", block:"center"}); } });

  /* ============================================================
     AI SHEET (mobile)
  ============================================================ */
  function openAiSheet(){
    if(window.innerWidth >= 1024){
      document.getElementById("chatInputDesktop").focus();
      return;
    }
    ensureGreeting("mobile");
    document.getElementById("aiSheetOverlay").classList.add("open");
    document.getElementById("aiSheet").classList.add("open");
    setActiveNav("ai");
    document.body.style.overflow = "hidden";
  }
  function closeAiSheet(){
    document.getElementById("aiSheetOverlay").classList.remove("open");
    document.getElementById("aiSheet").classList.remove("open");
    document.body.style.overflow = "";
    setActiveNav(state.view);
  }
  document.getElementById("aiSheetOverlay").addEventListener("click", closeAiSheet);
  document.getElementById("aiSheetClose").addEventListener("click", closeAiSheet);

  /* ============================================================
     SEARCH
  ============================================================ */
  var searchDebounce = null;
  document.getElementById("searchInput").addEventListener("input", function(e){
    var val = e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function(){
      state.query = val;
      if(val.trim() && state.view !== "bookmarks"){ /* keep current view (home/discover) */ }
      renderFeed();
    }, 150);
  });

  /* ============================================================
     INIT
  ============================================================ */
  function init(){
    renderTicker();
    renderChips();
    renderTrending();
    generateBriefing();
    renderPromptChips();
    updateBookmarkBadges();
    renderFeed();
  }

  init();
})();
</script>
</body>
</html>
